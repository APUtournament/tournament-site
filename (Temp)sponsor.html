<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oita×APU Asia-Pacific e-Sports Tournament 2026 - SPONSOR</title>
    <link rel="stylesheet" href="tournament.css">
    <style>
        /* 깃허브 서버 및 모바일 환경에서도 정렬이 무조건 유지되도록 인라인 스타일 보완 */
        .sponsor-grid-custom {
            display: flex !important;
            flex-wrap: wrap !important; /* 모바일과 PC 모두 유연하게 대응하기 위해 wrap으로 변경 */
            justify-content: center !important;
            gap: 20px !important;
            align-items: center !important;
            width: 100% !important;
        }

        /* 골드: PC에서는 한 줄에 2개 (정확히 50% 유연한 분할) */
        .gold-item-custom {
            width: calc(50% - 10px) !important;
            max-width: 500px !important;
            height: 200px !important; /* PC 기준 높이 고정 */
        }

        /* 실버: PC에서는 한 줄에 3개 (정확히 33.33% 분할) */
        .silver-item-custom {
            width: calc(33.333% - 14px) !important;
            max-width: 250px !important;
            height: 140px !important; /* PC 기준 높이 고정 */
        }

        /* 서포터: 텍스트 전용 스타일링 */
        .supporter-text-container {
            display: flex !important;
            flex-wrap: wrap !important;
            justify-content: center !important;
            gap: 30px !important;
            padding: 20px !important;
        }

        .supporter-text-item {
            font-size: 1.2rem !important;
            font-weight: bold !important;
            color: #ffffff !important;
            text-decoration: none !important;
            transition: color 0.3s ease !important;
        }

        .supporter-text-item:hover {
            color: #cd7f32 !important; /* 마우스 올렸을 때 서포터 고유 색상으로 변경 */
        }

        /* ==========================================
           모바일 화면 (768px 이하) 최적화 레이아웃
        ========================================== */
        @media (max-width: 768px) {
        .sponsor-grid-custom {
            flex-wrap: wrap !important; /* 모바일에서는 자연스럽게 아래로 떨어지도록 설정 */
            gap: 15px !important;       /* 모바일 여백 좁힘 */
        }
        
        /* 골드: 모바일에서는 한 줄에 1개씩 꽉 차게 배치 */
        .gold-item-custom {
            width: 100% !important;     /* 너비 100% */
            max-width: 340px !important; /* tournament.css와 맞춤 */
            height: auto !important;     /* 높이는 이미지 비율에 맞게 자동 조절 */
            padding: 15px !important;   /* 안쪽 여백 약간 줄임 */
        }
        
        /* 실버: 모바일에서는 한 줄에 2개씩 배치 (calc 계산 수정) */
        .silver-item-custom {
            width: calc(50% - 8px) !important; /* 2열 배치 */
            max-width: 180px !important;
            height: auto !important;
            padding: 10px !important;
        }
        
        .supporter-text-item {
            font-size: 1rem !important;
        }
    }
</style>
</head>
<body class="body-css">

    <header>
        <div class="header-css" style="justify-content: center !important; flex-direction: row !important; padding: 10px 0 !important; max-height: 80px !important;">
            <img src="APAC  透過.png" alt="大会アイコン" width="100" style="margin: 0 auto !important;">
        </div>
    </header>

    <main class="bg-color text-white top-padding" style="min-height: 100vh; box-sizing: border-box;">

        <section id="sponsor" class="info-section">
            
            <h2 style="text-align: center !important; border-left: none !important; padding-left: 0 !important; font-size: 40px; margin-bottom: 20px;">SPONSOR</h2>
            
            <p class="sponsor-subtitle" style="text-align: center !important; color: #ccc; margin-bottom: 50px; line-height: 1.6;">
                大会を後援してくださるパートナー企業様のロゴ掲載イメージです。<br>
                プランに応じて以下のサイズ・配置で公式HPに掲載されます。
            </p>

            <div class="sponsor-tier top">
                <h2 style="border-left: none !important; padding-left: 0 !important;">TOP SPONSOR</h2>
                <div class="sponsor-grid">
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="sponsor-item">
                        <img src="company logo example.svg" alt="トップスポンサー 1" width="750" height="300">
                    </a>
                </div>
            </div>

            <div class="sponsor-tier gold">
                <h2 style="border-left: none !important; padding-left: 0 !important;">GOLD SPONSOR</h2>
                <div class="sponsor-grid-custom">
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="sponsor-item gold-item-custom">
                        <img src="company logo example.svg" alt="ゴールドスポンサー 1" width="500" height="200">
                    </a>
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="sponsor-item gold-item-custom">
                        <img src="company logo example.svg" alt="ゴールドスポンサー 2" width="500" height="200">
                    </a>
                </div>
            </div>

            <div class="sponsor-tier silver">
                <h2 style="border-left: none !important; padding-left: 0 !important;">SILVER SPONSOR</h2>
                <div class="sponsor-grid-custom">
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="sponsor-item silver-item-custom">
                        <img src="company logo example.svg" alt="シルバースポンサー 1" width="250" height="100">
                    </a>
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="sponsor-item silver-item-custom">
                        <img src="company logo example.svg" alt="シルバースポンサー 2" width="250" height="100">
                    </a>
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="sponsor-item silver-item-custom">
                        <img src="company logo example.svg" alt="シルバースポンサー 3" width="250" height="100">
                    </a>
                </div>
            </div>

            <div class="sponsor-tier supporter">
                <h2 style="border-left: none !important; padding-left: 0 !important;">SUPPORTER</h2>
                <div class="supporter-text-container">
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="supporter-text-item">サポーター企業 A</a>
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="supporter-text-item">サポーター企業 B</a>
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="supporter-text-item">サポーター企業 C</a>
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="supporter-text-item">サポーター企業 D</a>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 APU E-SPORTS CLUB</p>
    </footer>

</body>
</html>
