<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oita×APU Asia-Pacific e-Sports Tournament 2026 - SPONSOR</title>
    <!-- 기존 index.html과 완벽하게 동일한 배경 및 상단 디자인을 유지합니다 -->
    <link rel="stylesheet" href="tournament.css">
</head>
<body class="body-css">

    <!-- 1. 상단 헤더 바 (네비게이션 메뉴 텍스트 전체 제거, 로고만 유지) -->
    <header>
        <div class="header-css">
            <img src="APAC  透過.png" alt="大会アイコン" width="100">
            <!-- 기업 제안용 단독 페이지 구성을 위해 메뉴 리스트(ul)를 모두 제거했습니다 -->
        </div>
    </header>

    <!-- 2. 메인 컨텐츠 영역 (배경 무너짐 방지 및 여백 유지 구조) -->
    <main class="bg-color text-white top-padding" style="min-height: 100vh; box-sizing: border-box;">

        <!-- 스폰서 전용 섹션 -->
        <section id="sponsor" class="info-section" style="padding-top: 50px;">
            <h2>SPONSOR</h2>
            <p class="sponsor-subtitle" style="text-align: center; color: #ccc; margin-bottom: 50px; line-height: 1.6;">
                大会を後援してくださるパートナー企業様のロゴ掲載イメージです。<br>
                プランに応じて以下のサイズ・配置で公式HPに掲載されます。
            </p>

            <!-- TOP SPONSOR (1개 배치) -->
            <div class="sponsor-tier top">
                <h2>TOP SPONSOR</h2>
                <div class="sponsor-grid">
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="sponsor-item">
                        <img src="Logos/company logo example.svg" alt="トップスポンサー 1" width="750" height="300">
                    </a>
                </div>
            </div>

            <!-- GOLD SPONSOR (2개 배치) -->
            <div class="sponsor-tier gold">
                <h2>GOLD SPONSOR</h2>
                <div class="sponsor-grid">
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="sponsor-item">
                        <img src="Logos/company logo example.svg" alt="ゴールドスポンサー 1" width="500" height="200">
                    </a>
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="sponsor-item">
                        <img src="Logos/company logo example.svg" alt="ゴールドスポンサー 2" width="500" height="200">
                    </a>
                </div>
            </div>

            <!-- SILVER SPONSOR (3개 배치) -->
            <div class="sponsor-tier silver">
                <h2>SILVER SPONSOR</h2>
                <div class="sponsor-grid">
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="sponsor-item">
                        <img src="Logos/company logo example.svg" alt="シルバースポンサー 1" width="250" height="100">
                    </a>
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="sponsor-item">
                        <img src="Logos/company logo example.svg" alt="シルバースポンサー 2" width="250" height="100">
                    </a>
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="sponsor-item">
                        <img src="Logos/company logo example.svg" alt="シルバースポンサー 3" width="250" height="100">
                    </a>
                </div>
            </div>

            <!-- SUPPORTER (4개 배치) -->
            <div class="sponsor-tier supporter">
                <h2>SUPPORTER</h2>
                <div class="sponsor-grid">
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="sponsor-item">
                        <img src="Logos/company logo example.svg" alt="サポーター 1" width="180" height="72">
                    </a>
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="sponsor-item">
                        <img src="Logos/company logo example.svg" alt="サポーター 2" width="180" height="72">
                    </a>
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="sponsor-item">
                        <img src="Logos/company logo example.svg" alt="サポーター 3" width="180" height="72">
                    </a>
                    <a href="https://sponsor-website.com" target="_blank" rel="noopener noreferrer" class="sponsor-item">
                        <img src="Logos/company logo example.svg" alt="サポーター 4" width="180" height="72">
                    </a>
                </div>
            </div>
        </section>

    </main>

    <!-- 3. 하단 푸터 영역 -->
    <footer>
        <p>&copy; 2026 APU E-SPORTS CLUB</p>
    </footer>

</body>
</html>
